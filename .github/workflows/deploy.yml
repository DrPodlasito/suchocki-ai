name: Deploy to GitHub Pages

on:
  # Every push to main publishes. That is the whole deploy story.
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing anything,
  # which is useful if a build failed for a transient reason.
  workflow_dispatch:

# Read the repo, write the Pages deployment, mint the OIDC token Pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the second deploy finish rather than
# cancelling it — a half-cancelled deploy is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
